openapi: 3.1.0
info:
  title: careerAPI
  version: 0.1.0
  description: |
    Backend for the careerAI frontend: student accounts that come from
    institutes, institute subscriptions, the weekly aptitude contest, and the
    admin panel.

    **Schema:** `account_subscription_er_diagram.png` (institute, user,
    user_metadata, subscription, payments) and `migrations/`.
    **Contest rules:** `careerAI/docs/aptitude-contest-backend.md`.

    ### Who can register
    Only students on an institute's list. An admin creates the institute and
    uploads its list of names and phone numbers (`POST /admin/institutes/{id}/students`).
    A student registers with that name, phone and the institute ID, then picks a
    username and password and fills in their details. They log in with the
    username after that. A student on two lists (school and tuition) has one
    account: the second time, they add the institute with their existing password
    (`POST /auth/register/link`).

    ### Sessions
    - Students log in at `/auth/*` and get the `careerai_session` cookie.
    - Admins log in at `/admin/auth/*` and get a **separate** `careerai_admin_session` cookie.
    - Both are opaque, `HttpOnly; Secure; SameSite=None; Path=/` cookies (the frontend is another site,
      or reaches the API through an `/api` proxy). The database stores only their SHA-256 hash.
    - Student sessions last 30 days and slide with use; admin sessions last 12 hours.

    ### Access (all or nothing)
    Every endpoint marked **Paid** first runs the access check and answers
    `402 payment_required` (reason `not_subscribed`) when the student has no
    access. A student has access while any institute list they're on has a
    subscription covering today, from an active institute.

    ### Subscriptions and payments
    There is no online checkout. Uploading an institute's list creates a
    subscription for the headcount and dates the admin enters; that is what
    grants access. The institute's payment is recorded afterwards
    (`POST /admin/institutes/{id}/payments`).

    ### Conventions
    - JSON throughout. Times are ISO-8601 UTC strings; the frontend shows them in IST.
    - Payment amounts are in **rupees**, up to 2 decimals.
    - Phone numbers are 10-digit Indian mobile numbers; +91, 0, spaces and dashes are removed.
    - Errors are always `{ "error": { "code", "message", "field"?, "reason"?, "details"? } }`.
    - The API never returns other students' phones, emails or ids. Leaderboards show
      first name + last initial (`Ananya S.`).
servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: System
  - name: Auth
    description: Student login and registration. Free.
  - name: Me
    description: The logged-in student's own account.
  - name: Contest
    description: The weekly aptitude contest. Paid.
  - name: Careers
    description: The career catalogue the quiz matches against. Free.
  - name: Roadmap
    description: Career roadmaps, Class 10 to first job. Paid.
  - name: Career Space
    description: Live news, jobs, exams and scholarships for the student's career matches. Paid.
  - name: Service
    description: For trusted server-side callers. Bearer token, no cookie.
  - name: Admin auth
  - name: Admin · Overview
  - name: Admin · Contests
  - name: Admin · Institutes
  - name: Admin · Students
  - name: Admin · Admins
  - name: Admin · Roadmaps
    description: Edit any career's roadmap. Students see a save straight away.

security:
  - studentSession: []

paths:
  # ══════════════════════════════════════════════════════════════
  # SYSTEM
  # ══════════════════════════════════════════════════════════════
  /health:
    get:
      tags: [System]
      summary: Liveness and database check
      security: []
      responses:
        '200':
          description: API and database are up
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  db: { type: string, example: 'PostgreSQL 18.0 on x86_64-pc-linux-gnu' }
                  server_time: { type: string, format: date-time }
        '503':
          description: Database unreachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: false }
                  error: { type: string, example: database unreachable }

  # ══════════════════════════════════════════════════════════════
  # STUDENT AUTH
  # ══════════════════════════════════════════════════════════════
  /auth/register/check:
    post:
      tags: [Auth]
      summary: 'Registration step 1: is this student on the institute''s list?'
      description: |
        Name (case and extra spaces ignored), phone and institute ID, as the
        institute gave them. `new`: go on to `POST /auth/register`.
        `existing_account`: this person already has an account (from another
        institute), so ask for its password and call `POST /auth/register/link`.

        An institute with `accepts_requests` also takes students who aren't on
        its list: then `needs_approval` is true, and finishing either step
        creates (or links) the account with a join request instead of a list
        place. The account has no access (`pending_approval`) until an admin
        approves the request.

        An institute with a live pilot (`pilot_mode`) takes them too: then
        `pilot` is true, and finishing either step puts them on the list as a
        pilot student with access straight away. If their class's pilot seats
        are full, an institute with `accepts_requests` falls back to a join
        request; otherwise it's `409 pilot_full` (here only when both classes
        are full, since the class isn't known yet for a new account). A
        school's pilot refuses anyone already on another school's list
        (`409 already_at_school`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListEntry' }
      responses:
        '200':
          description: What to do next
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [new, existing_account] }
                  username: { type: string, description: 'Only with `existing_account`, and not with `needs_approval` or `pilot` (anyone with an open institute''s ID could look it up)' }
                  needs_approval: { type: boolean, description: 'Not on the list: finishing leaves a join request for an admin to approve' }
                  pilot: { type: boolean, description: 'Not on the list: finishing takes a pilot seat, with access straight away' }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { description: '`account_disabled`: their account was switched off by an admin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: '`not_on_list`: no such name + phone on that (active) institute''s list', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: '`already_registered`: this list row already has an account. `request_pending`: this account has already asked to join this institute. `pilot_full`: no pilot seats left (for their class, when they have an account; else for either class). `already_at_school`: a school''s pilot, and they''re on another school''s list', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /auth/register:
    post:
      tags: [Auth]
      summary: Create a student account
      description: |
        For a student on an institute's list with no account yet. Creates the
        account, links the list row to it and logs them in (sets
        `careerai_session`). The account keeps the name and phone from the list.
        Email is optional; it's where password-reset links go.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ListEntry'
                - type: object
                  required: [username, password, class, board, city]
                  properties:
                    username: { type: string, pattern: '^[A-Za-z0-9._]{3,30}$', description: Stored lower-case, example: ananya.s }
                    password: { type: string, format: password, minLength: 8, maxLength: 200 }
                    email: { type: [string, 'null'], format: email }
                    class: { type: integer, enum: [9, 10] }
                    board: { type: string, enum: [CBSE, ICSE, State Board] }
                    city: { type: string, maxLength: 80 }
      responses:
        '201':
          description: Registered and logged in
          headers:
            Set-Cookie: { $ref: '#/components/headers/StudentCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { description: '`not_on_list`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409':
          description: '`username_taken`, `already_registered`, `account_exists` (use `/auth/register/link`), `pilot_full` (no pilot seats left for the chosen class; `field: class`) or `already_at_school`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/register/link:
    post:
      tags: [Auth]
      summary: Add this institute to my existing account
      description: |
        For a student who already has an account and is on another institute's
        list. Checks the existing account's password, links the list row to it
        and logs them in. The response holds their saved details, so the form
        can show them filled in. A school takes over as the institute their
        account shows.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ListEntry'
                - type: object
                  required: [password]
                  properties:
                    password: { type: string, format: password, description: The existing account's password }
      responses:
        '200':
          description: Linked and logged in
          headers:
            Set-Cookie: { $ref: '#/components/headers/StudentCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { description: '`bad_credentials`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: '`account_disabled`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: '`not_on_list`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: '`already_registered`. `request_pending`: this account has already asked to join this institute. `pilot_full`: no pilot seats left for their class. `already_at_school`: a school''s pilot, and they''re on another school''s list', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in as a student
      description: |
        Username (case-insensitive) and password. The response includes the
        access check, so the app can go straight to the dashboard or to the
        paywall. Soft-deleted accounts get the same `401` as a wrong password. A
        deactivated account (malpractice) gets `403 account_deactivated`, but
        only when the password is right, so nobody can find out which accounts
        are deactivated.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: Logged in
          headers:
            Set-Cookie: { $ref: '#/components/headers/StudentCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401':
          description: '`bad_credentials`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: bad_credentials, message: Username or password is incorrect. } }
        '403':
          description: '`account_deactivated`: the password is right but an admin deactivated the account'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: account_deactivated, message: Your account has been deactivated. Please contact your institute. } }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out (deletes the session)
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Email a password-reset link (confirmed emails only)
      description: |
        If the account has an email the student has confirmed (`POST
        /me/email/confirm`, then the emailed link), a reset link valid for 30
        minutes goes there. Nothing is sent to an unconfirmed email, or for a
        deleted or deactivated account.

        The answer is always `200 { ok: true }`, and takes at least ~2.5 s, so
        neither the answer nor its timing tells which usernames exist or which
        have a confirmed email. A failed send is logged, not returned. At most
        one link a minute per account. A student without a confirmed email asks
        their institute to contact us, and an admin sets a new password
        (`POST /admin/students/{id}/password`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Invalid' }

  /auth/confirm-email:
    post:
      tags: [Auth]
      summary: Confirm an email from the emailed link
      description: |
        `token` is the part after `#confirm=` in the link `POST /me/email/confirm`
        sent. It works once, for 24 hours, and doesn't need a login (the student
        may open it on another device). It confirms the account's email only if
        that's still the address the link went to; changing the email cancels
        any link already sent.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { description: '`invalid_link`: wrong, used, expired, or the email has changed since', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password from an emailed link
      description: |
        `token` is the part after `#reset=` in the link. It works once. Links only
        go to confirmed emails, and changing the email cancels them. On success
        every session of that student ends (and this browser's cookie is
        cleared); log in again with the new password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, format: password, minLength: 8, maxLength: 200 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { description: '`invalid` (bad field) or `invalid_link` (wrong, used or expired)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ══════════════════════════════════════════════════════════════
  # ME
  # ══════════════════════════════════════════════════════════════
  /me:
    get:
      tags: [Me]
      summary: The logged-in student
      description: Free. Works without access, so the paywall can greet the student.
      responses:
        '200':
          description: The student
          content:
            application/json:
              schema:
                type: object
                properties:
                  student: { $ref: '#/components/schemas/Student' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    put:
      tags: [Me]
      summary: Change my email, class, board or city
      description: |
        Free: registration and adding an institute end on this form. Only the
        keys sent change. `email` null or blank removes it; a changed email is
        unverified until a reset link reaches it. Name and phone can't change:
        they are how institutes' lists find the student.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: [string, 'null'], format: email }
                class: { type: integer, enum: [9, 10] }
                board: { type: string, enum: [CBSE, ICSE, State Board] }
                city: { type: string, maxLength: 80 }
      responses:
        '200':
          description: The updated student
          content:
            application/json:
              schema:
                type: object
                properties:
                  student: { $ref: '#/components/schemas/Student' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /me/email/confirm:
    post:
      tags: [Me]
      summary: Email a link that confirms the student's email
      description: |
        Free. The "Confirm email" button on the account page: the only time a
        confirmation email is sent (never at registration). The link goes to the
        account's current email and works once, for 24 hours (`POST
        /auth/confirm-email`). Pressing it again within a minute sends nothing
        (`already_sent`).
      responses:
        '200':
          description: What happened
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [sent, already_sent, already_verified] }
        '400': { description: '`no_email`: add an email first (`PUT /me`)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { description: '`email_failed`: the email provider rejected the message', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /me/access:
    get:
      tags: [Me]
      summary: Does this student have access?
      description: Free. The same check every paid endpoint runs.
      responses:
        '200':
          description: Access result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Access' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /me/profile:
    get:
      tags: [Me]
      summary: Onboarding answers
      description: '**Paid.**'
      responses:
        '200':
          description: The profile. class, board and city are always there (from registration); completed_at says whether onboarding is done.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
    put:
      tags: [Me]
      summary: Save onboarding answers
      description: |
        **Paid.** Each answer only changes when its key is sent (`null` clears
        it), so a step or the Settings editor can save just its own fields.
        `class`, `board` and `city` update the account and can't be cleared.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Profile' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '402': { $ref: '#/components/responses/PaymentRequired' }

  /me/career-quiz:
    post:
      tags: [Me]
      summary: Save a career quiz run
      description: |
        **Paid.** Stores the run and, in the same transaction, deletes the
        student's older runs (only the latest 2 are kept) and sets
        `students.current_career = top_career` (schema §4.2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [riasec_pct, riasec_code, top_career, results]
              properties:
                riasec_pct:
                  type: object
                  additionalProperties: { type: integer, minimum: 0, maximum: 100 }
                  example: { R: 35, I: 90, A: 40, S: 30, E: 35, C: 75 }
                riasec_code: { type: string, pattern: '^[RIASEC]{1,3}$', example: ICA }
                confidence: { type: [string, 'null'], enum: [high, medium, low, null] }
                top_career: { type: string, maxLength: 80, example: UX Designer }
                results: { type: object, description: The full `appResults` object, so the results page can be re-drawn as-is }
                answers: { type: [array, 'null'], items: {}, description: Raw quiz answers, so a run can be re-scored }
                engine_version: { type: [string, 'null'] }
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  current_career: { type: string }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '402': { $ref: '#/components/responses/PaymentRequired' }

  /me/career-quiz/latest:
    get:
      tags: [Me]
      summary: My latest career quiz run
      description: |
        **Paid.** What the dashboard and Career Matches show after login.
        `result` is `null` when the student hasn't taken the quiz yet.
      responses:
        '200':
          description: Latest run
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { oneOf: [{ $ref: '#/components/schemas/QuizResult' }, { type: 'null' }] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '402': { $ref: '#/components/responses/PaymentRequired' }

  /me/career-quiz/runs:
    get:
      tags: [Me]
      summary: My saved career quiz runs
      description: |
        **Paid.** The kept runs (at most 2), newest first. Progress →
        Top Match Evolution shows `results[1]` as "Previous" and
        `results[0]` as "Latest". Empty before the first run.
      responses:
        '200':
          description: Saved runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    maxItems: 2
                    items: { $ref: '#/components/schemas/QuizResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '402': { $ref: '#/components/responses/PaymentRequired' }

  /me/career:
    put:
      tags: [Me]
      summary: Set my current career
      description: '**Paid.** Career leaderboards group by this (contest spec §4.8).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [career]
              properties:
                career: { type: string, example: Architect }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '402': { $ref: '#/components/responses/PaymentRequired' }

  /me/contest-history:
    get:
      tags: [Contest]
      summary: My result in every closed contest
      description: '**Paid.** Newest first. Career ranks use the **current** career.'
      responses:
        '200':
          description: History
          content:
            application/json:
              schema:
                type: object
                properties:
                  career: { type: [string, 'null'] }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        contest: { $ref: '#/components/schemas/Contest' }
                        attempted: { type: boolean }
                        score: { type: [integer, 'null'] }
                        correct: { type: [integer, 'null'] }
                        total_questions: { type: integer, const: 5 }
                        time_taken_s: { type: [integer, 'null'] }
                        global: { oneOf: [{ $ref: '#/components/schemas/Rank' }, { type: 'null' }] }
                        career: { oneOf: [{ $ref: '#/components/schemas/Rank' }, { type: 'null' }] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '402': { $ref: '#/components/responses/PaymentRequired' }

  # ══════════════════════════════════════════════════════════════
  # CAREERS (free)
  # ══════════════════════════════════════════════════════════════
  /careers:
    get:
      tags: [Careers]
      summary: The career catalogue
      description: |
        Every career, in catalogue order — the order the frontend's matching
        engine (riasec_engine.js) sees them in. Each item has the same shape
        as an entry of the old `RIASEC_CAREERS` array. Cacheable for 5 minutes.
      security: []
      responses:
        '200':
          description: Catalogue
          content:
            application/json:
              schema:
                type: object
                properties:
                  careers:
                    type: array
                    items: { $ref: '#/components/schemas/Career' }

  # ══════════════════════════════════════════════════════════════
  # ROADMAP (all paid)
  # ══════════════════════════════════════════════════════════════
  /roadmaps:
    get:
      tags: [Roadmap]
      summary: Careers that have a roadmap
      description: '**Paid.** The careers the roadmap picker offers, in display order.'
      responses:
        '200':
          description: Careers
          content:
            application/json:
              schema:
                type: object
                properties:
                  roadmaps:
                    type: array
                    items:
                      type: object
                      properties:
                        career: { type: string, example: UI/UX Designer }
                        emoji: { type: [string, 'null'], example: 🎨 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '402': { $ref: '#/components/responses/PaymentRequired' }

  /roadmap:
    get:
      tags: [Roadmap]
      summary: One career's roadmap
      description: |
        **Paid.** The career is a query parameter because titles can contain
        a slash. Matched case-insensitively.
      parameters:
        - in: query
          name: career
          required: true
          schema: { type: string, maxLength: 80, example: UI/UX Designer }
      responses:
        '200':
          description: Roadmap
          content:
            application/json:
              schema:
                type: object
                properties:
                  roadmap: { $ref: '#/components/schemas/Roadmap' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ══════════════════════════════════════════════════════════════
  # CAREER SPACE (paid)
  # ══════════════════════════════════════════════════════════════
  /career-news:
    get:
      tags: [Career Space]
      summary: Latest news, jobs, exams and scholarships for one career
      description: |
        **Paid.** Headlines from every configured news provider (GNews when
        `GNEWS_API_KEY` is set, Google News), merged, de-duplicated and newest
        first. India comes first: up to 20 of a tab's 30 places (25 in exams)
        go to Indian stories and the rest to stories from anywhere, either
        side filling what the other can't. Each career's feed is cached for `NEWS_CACHE_HOURS` (default 12);
        if every provider fails on a refresh, the last feed is returned.
        Any career in the catalogue works, matched case-insensitively.
      parameters:
        - in: query
          name: career
          required: true
          schema: { type: string, maxLength: 80, example: Robotics & Mechatronics Engineer }
      responses:
        '200':
          description: Feed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CareerNews' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ══════════════════════════════════════════════════════════════
  # SERVICE (bearer token)
  # ══════════════════════════════════════════════════════════════
  /userContext:
    get:
      tags: [Service]
      summary: A student's profile, top career matches and contest scores
      description: >-
        Looked up by username (case-insensitive). Needs `Authorization: Bearer <USER_CONTEXT_TOKEN>`;
        with that unset on the server every call is `401`. Not behind the paywall.
        `top_careers` is the first 5 of the latest quiz run's `results.top_careers` ([] before the quiz);
        `contest_scores` matches the rows of `GET /me/contest-history`.
      security:
        - serviceToken: []
      parameters:
        - in: query
          name: username
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The student's context
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: { type: string }
                  email: { type: [string, 'null'] }
                  full_name: { type: string }
                  profile: { $ref: '#/components/schemas/Profile' }
                  top_careers: { type: array, maxItems: 5, items: { type: object } }
                  contest_scores:
                    type: array
                    items:
                      type: object
                      properties:
                        contest: { $ref: '#/components/schemas/Contest' }
                        attempted: { type: boolean }
                        score: { type: [integer, 'null'] }
                        correct: { type: [integer, 'null'] }
                        total_questions: { type: integer, const: 5 }
                        time_taken_s: { type: [integer, 'null'] }
                        global: { oneOf: [{ $ref: '#/components/schemas/Rank' }, { type: 'null' }] }
                        career: { oneOf: [{ $ref: '#/components/schemas/Rank' }, { type: 'null' }] }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ══════════════════════════════════════════════════════════════
  # CONTEST (all paid)
  # ══════════════════════════════════════════════════════════════
  /contest/state:
    get:
      tags: [Contest]
      summary: Starting point of the contest page
      description: '**Paid.** `contest` is this week''s while it''s open, otherwise the next one.'
      responses:
        '200':
          description: State
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_time: { type: string, format: date-time }
                  contest: { $ref: '#/components/schemas/Contest' }
                  attempt:
                    type: object
                    properties:
                      status: { type: string, enum: [not_started, in_progress, submitted] }
                      started_at: { type: [string, 'null'], format: date-time }
                      submitted_at: { type: [string, 'null'], format: date-time }
                      answered_count: { type: integer }
                      auto_submitted: { type: boolean }
                  latest_published: { oneOf: [{ $ref: '#/components/schemas/Contest' }, { type: 'null' }] }
                  published_count: { type: integer }
                  career: { type: [string, 'null'] }
                  careers:
                    type: array
                    items: { type: string }
                    description: 'The career leaderboards on offer: the current career, then the rest of the latest career quiz run''s top careers'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '402': { $ref: '#/components/responses/PaymentRequired' }

  /contest/{id}/attempt:
    parameters:
      - $ref: '#/components/parameters/ContestId'
    post:
      tags: [Contest]
      summary: Start (or resume) my attempt
      description: |
        **Paid.** Starts the clock on the server. Calling it again resumes the same
        attempt without resetting the clock. Questions never include the answer.
      responses:
        '200':
          description: The attempt
          content:
            application/json:
              schema:
                type: object
                properties:
                  contest: { $ref: '#/components/schemas/Contest' }
                  started_at: { type: string, format: date-time }
                  questions:
                    type: array
                    items: { $ref: '#/components/schemas/PublicQuestion' }
                  answers:
                    type: object
                    additionalProperties: { type: integer, minimum: 0, maximum: 3 }
                    example: { c5-q1: 2 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { description: '`not_open`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '`already_submitted`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /contest/{id}/attempt/answers/{questionId}:
    parameters:
      - $ref: '#/components/parameters/ContestId'
      - in: path
        name: questionId
        required: true
        schema: { type: string, example: c5-q1 }
    put:
      tags: [Contest]
      summary: Save my answer to one question
      description: '**Paid.** Upsert; the latest choice wins.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [option_index]
              properties:
                option_index: { type: integer, minimum: 0, maximum: 3 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { description: '`bad_question` (not in this contest)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { description: '`not_open`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: '`already_submitted` or `not_started`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /contest/{id}/attempt/submit:
    parameters:
      - $ref: '#/components/parameters/ContestId'
    post:
      tags: [Contest]
      summary: Submit my attempt
      description: '**Paid.** Final and idempotent. The response deliberately contains **no score**; scores appear after close.'
      responses:
        '200':
          description: Submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  submitted_at: { type: string, format: date-time }
                  time_taken_s: { type: integer, minimum: 1 }
                  results_at: { type: string, format: date-time, description: The contest's closes_at }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { description: '`not_open`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: '`not_started`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /contest/{id}/review:
    parameters:
      - $ref: '#/components/parameters/ContestId'
    get:
      tags: [Contest]
      summary: Answers and my result, after close
      description: '**Paid.** Available to every student after close, including those who didn''t take part.'
      responses:
        '200':
          description: Review
          content:
            application/json:
              schema:
                type: object
                properties:
                  contest: { $ref: '#/components/schemas/Contest' }
                  attempted: { type: boolean }
                  score: { type: [integer, 'null'] }
                  correct: { type: [integer, 'null'] }
                  total_questions: { type: integer, const: 5 }
                  time_taken_s: { type: [integer, 'null'] }
                  global: { oneOf: [{ $ref: '#/components/schemas/Rank' }, { type: 'null' }] }
                  career:
                    oneOf:
                      - allOf:
                          - $ref: '#/components/schemas/Rank'
                          - type: object
                            properties:
                              name: { type: string, example: Architect }
                      - type: 'null'
                  questions:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/PublicQuestion'
                        - type: object
                          properties:
                            correct_index: { type: integer, minimum: 0, maximum: 3 }
                            explanation: { type: string }
                            your_index: { type: [integer, 'null'] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { description: '`not_published` (still open or upcoming)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /leaderboard:
    get:
      tags: [Contest]
      summary: Global or career leaderboard, for one week or all time
      description: '**Paid.** `me` is always included, even outside the top `limit`.'
      parameters:
        - { in: query, name: scope, schema: { type: string, enum: [global, career], default: global } }
        - { in: query, name: period, schema: { type: string, enum: [week, live], default: week } }
        - { in: query, name: career, description: 'Career scope only: one of `careers` from /contest/state (400 otherwise). Default: the current career. The student is always ranked on it.', schema: { type: string } }
        - { in: query, name: contest_id, description: 'Closed contest (week only). Default: latest closed.', schema: { type: integer } }
        - { in: query, name: limit, schema: { type: integer, default: 10, maximum: 100 } }
      responses:
        '200':
          description: Board
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope: { type: string, enum: [global, career] }
                  period: { type: string, enum: [week, live] }
                  career: { type: [string, 'null'], description: Career scope only }
                  contest: { oneOf: [{ $ref: '#/components/schemas/Contest' }, { type: 'null' }], description: Week only }
                  contests_count: { type: integer, description: 'Live: closed contests included' }
                  total_participants: { type: integer }
                  me: { oneOf: [{ $ref: '#/components/schemas/LeaderboardRow' }, { type: 'null' }] }
                  rows: { type: array, items: { $ref: '#/components/schemas/LeaderboardRow' } }
                  locked: { type: string, enum: [no_career], description: Only when scope=career and the student has no career yet }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { description: '`not_published`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ══════════════════════════════════════════════════════════════
  # ADMIN AUTH
  # ══════════════════════════════════════════════════════════════
  /admin/auth/login:
    post:
      tags: [Admin auth]
      summary: Log in as an admin
      description: There is no admin sign-up. The first admin comes from `npm run create-admin`; admins add each other. A locked-out admin can use `forgot-password`, or someone with database access can run `npm run reset-admin-password`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Logged in
          headers:
            Set-Cookie: { $ref: '#/components/headers/AdminCookie' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  admin: { $ref: '#/components/schemas/AdminRef' }
        '401': { description: '`bad_credentials`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/auth/logout:
    post:
      tags: [Admin auth]
      summary: Log out
      security: [{ adminSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /admin/auth/forgot-password:
    post:
      tags: [Admin auth]
      summary: Email a password-reset code
      description: |
        If the email belongs to an active admin, emails them a 6-digit code valid for 15 minutes,
        replacing any earlier code. A new code can be asked for at most once a minute.
        Always answers `200`, so it can't be used to find out which emails are admins.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '503': { description: '`email_failed`: the email provider rejected the message', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/auth/reset-password:
    post:
      tags: [Admin auth]
      summary: Set a new password with an emailed code
      description: |
        Trades the code from `forgot-password` for a new password. The code is single-use and allows
        5 wrong guesses. On success every session of that admin ends (and this browser's admin cookie
        is cleared); log in again with the new password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, new_password]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: '^\d{6}$', example: '042917' }
                new_password: { type: string, format: password, minLength: 8, maxLength: 200 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { description: '`invalid` (bad field) or `invalid_code` (wrong, used, expired or too many tries)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/me:
    get:
      tags: [Admin auth]
      summary: The logged-in admin
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Admin
          content:
            application/json:
              schema:
                type: object
                properties:
                  admin: { $ref: '#/components/schemas/AdminRef' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  # ══════════════════════════════════════════════════════════════
  # ADMIN
  # ══════════════════════════════════════════════════════════════
  /admin/overview:
    get:
      tags: [Admin · Overview]
      summary: Numbers for the admin home screen
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  students: { type: integer }
                  students_with_access: { type: integer }
                  institutes: { type: integer }
                  institutes_paying: { type: integer, description: With a subscription covering now }
                  next_contests: { type: array, items: { $ref: '#/components/schemas/AdminContest' } }
                  drafts_needing_questions: { type: array, items: { $ref: '#/components/schemas/AdminContest' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /admin/contests:
    get:
      tags: [Admin · Contests]
      summary: List contests
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Deleted'
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminContest' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Admin · Contests]
      summary: Create a draft contest for a Saturday
      description: Opens 07:00 IST that Saturday and closes 19:00 IST Sunday. Must be in the future, and the week must be free.
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date, description: A Saturday (IST), e.g. 2026-10-17 }
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminContestDetail' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { description: '`week_taken`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/contests/{id}:
    parameters:
      - $ref: '#/components/parameters/ContestId'
    get:
      tags: [Admin · Contests]
      summary: One contest with its questions and answers
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Contest
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminContestDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin · Contests]
      summary: Delete a contest
      description: Hard delete is only allowed before the contest opens. Use soft delete after that.
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/DeleteMode'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '`contest_locked`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/contests/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/ContestId'
    post:
      tags: [Admin · Contests]
      summary: Restore a soft-deleted contest
      security: [{ adminSession: [] }]
      responses:
        '200': { description: Restored, content: { application/json: { schema: { $ref: '#/components/schemas/AdminContest' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { description: '`week_taken`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/contests/{id}/questions/{position}:
    parameters:
      - $ref: '#/components/parameters/ContestId'
      - in: path
        name: position
        required: true
        schema: { type: integer, minimum: 1, maximum: 5 }
    put:
      tags: [Admin · Contests]
      summary: Create or replace question 1–5
      description: Rejected once the contest has opened (`contest_locked`). The question id is `c{contest_id}-q{position}`.
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionInput' }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/AdminContestDetail' } } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { description: '`contest_locked`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/contests/{id}/schedule:
    parameters:
      - $ref: '#/components/parameters/ContestId'
    post:
      tags: [Admin · Contests]
      summary: Schedule a draft (needs all 5 questions)
      security: [{ adminSession: [] }]
      responses:
        '200': { description: Scheduled, content: { application/json: { schema: { $ref: '#/components/schemas/AdminContestDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { description: '`needs_5_questions` or `contest_locked`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/contests/{id}/unschedule:
    parameters:
      - $ref: '#/components/parameters/ContestId'
    post:
      tags: [Admin · Contests]
      summary: Move a scheduled contest back to draft (before it opens)
      security: [{ adminSession: [] }]
      responses:
        '200': { description: Back to draft, content: { application/json: { schema: { $ref: '#/components/schemas/AdminContestDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { description: '`contest_locked`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/institutes:
    get:
      tags: [Admin · Institutes]
      summary: List institutes
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Deleted'
        - { in: query, name: q, description: 'Search name, institute ID or city', schema: { type: string } }
      responses:
        '200':
          description: Institutes, A–Z
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Institute' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Admin · Institutes]
      summary: Add an institute
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstituteInput' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Institute' } } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { description: '`institute_code_taken`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/institutes/{id}:
    parameters:
      - $ref: '#/components/parameters/InstituteId'
    get:
      tags: [Admin · Institutes]
      summary: One institute, deleted or not
      security: [{ adminSession: [] }]
      responses:
        '200': { description: The institute, content: { application/json: { schema: { $ref: '#/components/schemas/Institute' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Admin · Institutes]
      summary: Edit an institute
      description: Accounts showing this institute get its new institute ID too. Suspending it stops its subscriptions counting.
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstituteInput' }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Institute' } } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '`institute_code_taken`, or `school_conflict`: becoming a school would put students on two schools'' lists', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [Admin · Institutes]
      summary: Delete an institute
      description: |
        Soft: its subscriptions stop counting and students can't register through
        it; the list is kept and it can be restored. Hard: its list and
        subscriptions are removed; payments are kept with `institute_id = NULL`;
        student accounts stay. Either way, accounts that showed it show their
        next institute.
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/DeleteMode'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/institutes/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/InstituteId'
    post:
      tags: [Admin · Institutes]
      summary: Restore a soft-deleted institute
      security: [{ adminSession: [] }]
      responses:
        '200': { description: Restored, content: { application/json: { schema: { $ref: '#/components/schemas/Institute' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/institutes/{id}/students:
    parameters:
      - $ref: '#/components/parameters/InstituteId'
    get:
      tags: [Admin · Institutes]
      summary: The institute's student list
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: A–Z by name
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ListRow' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Admin · Institutes]
      summary: Upload a student list (creates a subscription)
      description: |
        The body is the file itself: an `.xlsx` (first sheet) or `.csv`, up to
        5 MB, with a name column and a phone column. A header row ("Name",
        "Phone no.") is used to find them; without one, name is the first column
        and phone the second. Blank rows are skipped.

        All or nothing. Any bad row (missing name, a phone that isn't a 10-digit
        mobile number, the same name + phone twice) is `422 invalid_rows` with
        every bad row in `details.errors`. More students than `head_count` is
        `422 headcount_exceeded`. Either way nothing is added.

        Otherwise a subscription is created for the headcount and dates, and every
        student in the file is put on it: new ones are added, ones already on the
        list (a renewal) move to it. Record the payment afterwards.

        Students who already have an account (matched by name + phone, else by
        old details an admin corrected) are linked to it straight away: no second
        account, no password step. A row matched by old details goes on the list
        with the account's current details.

        One school per student: a `school` upload takes everyone in it off any
        other school's list (`moved`), and the newest upload wins. When this
        subscription starts later and another school's still covers someone, the
        upload is refused (`409 school_move_too_early`, the students in
        `details.students`) so nobody is cut off in between.
      security: [{ adminSession: [] }]
      parameters:
        - { in: query, name: head_count, required: true, schema: { type: integer, minimum: 1 } }
        - { in: query, name: starts_at, required: true, schema: { type: string, format: date }, example: '2026-04-01' }
        - { in: query, name: ends_at, required: true, schema: { type: string, format: date }, description: Exclusive, example: '2027-04-01' }
      requestBody:
        required: true
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: { type: string, format: binary }
          text/csv:
            schema: { type: string, example: "Name,Phone no.\nAnanya Sharma,9876543210\n" }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription: { $ref: '#/components/schemas/Subscription' }
                  rows: { type: integer, description: Students in the file }
                  added: { type: integer, description: New to the list }
                  renewed: { type: integer, description: Already on the list, moved to this subscription }
                  linked: { type: integer, description: Rows linked to an account that already existed }
                  moved:
                    type: array
                    description: Rows taken off another school's list (one school per student)
                    items:
                      type: object
                      properties:
                        full_name: { type: string }
                        phone_no: { type: string }
                        student_id: { type: [integer, 'null'], description: null when that row had no account }
                        from: { type: object, properties: { id: { type: integer }, name: { type: string }, institute_code: { type: string } } }
                  matched_by_old_details:
                    type: array
                    items:
                      type: object
                      properties:
                        uploaded_name: { type: string }
                        uploaded_phone: { type: string }
                        student_id: { type: integer }
                        current_name: { type: string }
                        current_phone: { type: string }
                  ambiguous:
                    type: array
                    description: Rows whose old details fit more than one account; added but not linked
                    items: { type: object, properties: { full_name: { type: string }, phone_no: { type: string } } }
                  deactivated:
                    type: array
                    description: Linked accounts that are deactivated (still can't log in)
                    items: { type: object, properties: { student_id: { type: integer }, full_name: { type: string }, phone_no: { type: string } } }
                  pilot_unmatched:
                    type: array
                    description: |
                      Pilot students on this list the file didn't match (still on
                      no subscription). Not stored: only in this response. Fix a
                      misspelling by correcting the student's name and phone
                      (`PATCH /admin/students/{id}/details`), which merges the
                      uploaded row into theirs.
                    items:
                      type: object
                      properties:
                        student_id: { type: integer }
                        username: { type: string }
                        full_name: { type: string }
                        phone_no: { type: string }
                        class: { type: integer }
                        suggestions:
                          type: array
                          description: Rows in the file with the same phone and a different name
                          items: { type: object, properties: { full_name: { type: string }, phone_no: { type: string } } }
        '400': { description: '`invalid` (query), `bad_file`, `empty_file` or `too_many_rows`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '`institute_deleted`; `renewal_too_early`: a subscription starting later while students in the file are still on a current subscription or a live pilot (moving them now would cut them off); or `school_move_too_early`: the same, for students on another school''s current subscription', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422':
          description: '`invalid_rows` or `headcount_exceeded`; nothing was added'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: invalid_rows
                  message: 1 row has a problem, so nothing was added. Fix the file and upload it again.
                  details: { errors: [{ line: 4, reason: Phone number must be a 10-digit mobile number., value: 'Ravi Kumar, 12345' }] }
    delete:
      tags: [Admin · Institutes]
      summary: Remove one student from the list
      description: Their account (if any) stays, without this institute.
      security: [{ adminSession: [] }]
      parameters:
        - { in: query, name: full_name, required: true, schema: { type: string } }
        - { in: query, name: phone_no, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/institutes/{id}/requests:
    parameters:
      - $ref: '#/components/parameters/InstituteId'
    get:
      tags: [Admin · Institutes]
      summary: Join requests waiting for approval
      description: |
        Students who aren't on the list of an institute with
        `accepts_requests`, and registered (or linked their account) with its
        institute ID. Their account exists but has no access until approved.
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Oldest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/JoinRequest' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/institutes/{id}/requests/{requestId}/approve:
    parameters:
      - $ref: '#/components/parameters/InstituteId'
      - { name: requestId, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Admin · Institutes]
      summary: Approve a join request
      description: |
        Adds the student to the list, registered and on the institute's
        current subscription, so their account is active straight away, and
        deletes the request. The headcount isn't enforced; `over_headcount`
        says when the subscription now has more students than it.
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  student: { type: object, properties: { id: { type: integer }, username: { type: string }, has_access: { type: boolean, description: 'false if the institute is suspended' } } }
                  subscription:
                    type: object
                    properties:
                      id: { type: integer }
                      head_count: { type: integer }
                      students: { type: integer, description: On it now, including this student }
                      ends_at: { type: string, format: date-time }
                  over_headcount: { type: boolean }
                  moved_from:
                    type: array
                    description: Other schools they were taken off (one school per student)
                    items: { type: object, properties: { id: { type: integer }, name: { type: string }, institute_code: { type: string } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '`no_current_subscription`: nothing covers today, so approving wouldn''t activate them. `institute_deleted`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/institutes/{id}/requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/InstituteId'
      - { name: requestId, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [Admin · Institutes]
      summary: Reject a join request
      description: Deletes the request. The student's account stays, without this institute.
      security: [{ adminSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/institutes/{id}/subscriptions:
    parameters:
      - $ref: '#/components/parameters/InstituteId'
    get:
      tags: [Admin · Institutes]
      summary: The institute's subscriptions
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Subscription' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/institutes/{id}/payments:
    parameters:
      - $ref: '#/components/parameters/InstituteId'
    get:
      tags: [Admin · Institutes]
      summary: The institute's payments
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Payment' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Admin · Institutes]
      summary: Record a payment for one of its subscriptions
      description: Institutes pay outside the website. One payment per subscription.
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscription_id, amount, mode_of_payment, date_of_payment]
              properties:
                subscription_id: { type: integer }
                amount: { type: number, minimum: 0, description: Rupees, up to 2 decimals, example: 15000 }
                mode_of_payment: { type: string, maxLength: 40, example: UPI }
                transaction_id: { type: [string, 'null'], maxLength: 100, example: '426713859012' }
                date_of_payment: { type: string, format: date, example: '2026-04-02' }
      responses:
        '201': { description: Recorded, content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '`already_paid` or `duplicate_payment`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/students:
    get:
      tags: [Admin · Students]
      summary: List student accounts
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Deleted'
        - { in: query, name: deactivated, description: 'true: only deactivated accounts, deleted or not (ignores `deleted`)', schema: { type: boolean } }
        - { in: query, name: q, description: 'Search name, username, phone or email', schema: { type: string } }
      responses:
        '200':
          description: Accounts, A–Z, each with their access result
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminStudent' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /admin/students/{id}:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    get:
      tags: [Admin · Students]
      summary: One student account, deleted or not
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: The account with its access result and the institute lists it's on
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminStudent'
                  - type: object
                    properties:
                      institutes:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            name: { type: string }
                            institute_code: { type: string }
                            type: { type: string }
                            is_deleted: { type: boolean }
                            registered_at: { type: string, format: date-time }
                            subscription:
                              oneOf:
                                - { type: object, properties: { active: { type: boolean }, ends_at: { type: string, format: date-time } } }
                                - type: 'null'
                      old_details:
                        type: array
                        description: Names / phones it had before an admin corrected them, newest first. Uploads still match these.
                        items: { type: object, properties: { full_name: { type: string }, phone_no: { type: string }, replaced_at: { type: string, format: date-time } } }
                      history:
                        type: array
                        description: Newest first
                        items: { $ref: '#/components/schemas/StudentEvent' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin · Students]
      summary: Delete a student account
      description: |
        Soft: can't log in, hidden from leaderboards, restorable.
        Hard: removes the account, profile, quiz results, attempts and answers.
        Their institute list rows stay, back to unregistered, so they can register again.
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/DeleteMode'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/students/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    post:
      tags: [Admin · Students]
      summary: Restore a soft-deleted student
      security: [{ adminSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/students/{id}/password:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    post:
      tags: [Admin · Students]
      summary: Reset a student's password
      description: |
        Sets a new password and signs the student out on every device. The way
        back in for a student without a confirmed email. Recorded in their
        history (`password_set`). A soft-deleted or deactivated student still
        can't log in until restored / reactivated.
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password, minLength: 8, maxLength: 200 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/students/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    post:
      tags: [Admin · Students]
      summary: Deactivate (malpractice) or take off a list (left an institute)
      description: |
        One action, the reason decides:
        - `malpractice`: the whole account is locked. Signed out everywhere,
          can't log in (`403 account_deactivated` once the password is right),
          hidden from leaderboards; attempts and results are kept. Only
          `POST .../reactivate` lifts it. Separate from soft delete.
        - `left_institute`: only that institute's list row goes. The account
          keeps its other lists; on none, it can log in but has no access
          (`no_institute`). A later upload links it back.

        Recorded in the student's history with the note.
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, note]
              properties:
                reason: { type: string, enum: [malpractice, left_institute] }
                institute_id: { type: integer, description: Required for left_institute }
                note: { type: string, maxLength: 500, description: Why, and who asked }
      responses:
        '200':
          description: The student, as `GET /admin/students/{id}` returns it
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminStudent' } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '`already_deactivated`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/students/{id}/reactivate:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    post:
      tags: [Admin · Students]
      summary: Lift a malpractice deactivation
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [note], properties: { note: { type: string, maxLength: 500 } } }
      responses:
        '200':
          description: The student, as `GET /admin/students/{id}` returns it
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminStudent' } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '`not_deactivated`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/students/{id}/details:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    patch:
      tags: [Admin · Students]
      summary: Correct a student's name and/or phone
      description: |
        Admin only (students can't change these). The account and every list
        row it's on take the new details; the old ones are kept (`old_details`)
        so uploads that still carry them match this account. Refused when the
        new details are another account's (never merged). Unlinked list rows
        with the new details are this person: they merge into the account's
        row on lists it's on (keeping the later-ending subscription) and are
        linked to it elsewhere (one school kept). A change of case only is
        allowed and leaves no old details. Recorded in the history.
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                full_name: { type: string, maxLength: 80 }
                phone_no: { type: string }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: The student, as `GET /admin/students/{id}` returns it
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminStudent' } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '`person_taken`: another account has these details (`details.student` says which)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/admins:
    get:
      tags: [Admin · Admins]
      summary: List admins
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Deleted'
      responses:
        '200':
          description: Admins, A–Z
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Admin' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Admin · Admins]
      summary: Add an admin
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, email, password]
              properties:
                full_name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { description: '`email_taken`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/admins/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Admin · Admins]
      summary: Delete an admin (not yourself)
      description: Hard delete keeps their contests, institutes, subscriptions and payments, with `created_by` / `recorded_by` = NULL.
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/DeleteMode'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '`cannot_delete_self`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/admins/{id}/restore:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Admin · Admins]
      summary: Restore a soft-deleted admin
      security: [{ adminSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  # ── Admin · Roadmaps ──
  # The career is a query parameter: titles like "UI/UX Designer" contain a slash.
  /admin/roadmaps:
    get:
      tags: [Admin · Roadmaps]
      summary: Every career and its roadmap's state
      description: All careers in catalogue order, including those with no roadmap yet.
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Careers
          content:
            application/json:
              schema:
                type: object
                properties:
                  careers:
                    type: array
                    items: { $ref: '#/components/schemas/AdminRoadmapRow' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /admin/roadmap:
    parameters:
      - in: query
        name: career
        required: true
        description: The career's exact title.
        schema: { type: string, maxLength: 80, example: UI/UX Designer }
    get:
      tags: [Admin · Roadmaps]
      summary: One career's roadmap, for editing
      description: '`roadmap` is `null` when the career has none yet.'
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Career and roadmap
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRoadmap' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Admin · Roadmaps]
      summary: Save a career's roadmap
      description: |
        Replaces the whole roadmap. Send the `version` you opened (`null` when
        the career had no roadmap). If someone saved in the meantime the save
        is refused with `409 roadmap_changed`, so nobody's changes are lost.
        Limits: 1–10 stages; each with a "when" (≤60 chars), a title (≤150)
        and 1–10 actions (≤200 each).
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [steps, version]
              properties:
                steps:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { $ref: '#/components/schemas/RoadmapStep' }
                version: { type: [integer, 'null'], example: 3 }
      responses:
        '200':
          description: Saved — the new state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRoadmap' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '`roadmap_changed`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [Admin · Roadmaps]
      summary: Delete a career's roadmap
      description: Students then see "still writing the roadmap" for this career.
      security: [{ adminSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

# ══════════════════════════════════════════════════════════════
components:
  securitySchemes:
    studentSession:
      type: apiKey
      in: cookie
      name: careerai_session
    adminSession:
      type: apiKey
      in: cookie
      name: careerai_admin_session
    serviceToken:
      type: http
      scheme: bearer
      description: The server's USER_CONTEXT_TOKEN

  headers:
    StudentCookie:
      description: '`careerai_session=<token>; HttpOnly; Secure; SameSite=None; Path=/`'
      schema: { type: string }
    AdminCookie:
      description: '`careerai_admin_session=<token>; HttpOnly; Secure; SameSite=None; Path=/`'
      schema: { type: string }

  parameters:
    ContestId:
      in: path
      name: id
      required: true
      description: Contest id, which is also its public number (#1, #2…)
      schema: { type: integer, minimum: 1 }
    InstituteId:
      in: path
      name: id
      required: true
      schema: { type: integer, minimum: 1 }
    StudentId:
      in: path
      name: id
      required: true
      description: The account's id (user_metadata.id)
      schema: { type: integer, minimum: 1 }
    Deleted:
      in: query
      name: deleted
      description: '`true` lists only soft-deleted rows'
      schema: { type: boolean, default: false }
    DeleteMode:
      in: query
      name: mode
      description: '`soft` sets is_deleted and can be undone. `hard` is permanent (schema §7).'
      schema: { type: string, enum: [soft, hard], default: soft }

  responses:
    Ok:
      description: Done
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean, const: true }
    Invalid:
      description: Validation failed. `field` names the input to highlight.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: invalid, message: Password must be at least 8 characters., field: password } }
    Unauthenticated:
      description: '`unauthenticated`: no valid session'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: unauthenticated, message: Please log in. } }
    PaymentRequired:
      description: '`payment_required`: the student has no access. `reason` says why, for the paywall.'
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, const: payment_required }
                  message: { type: string }
                  reason: { $ref: '#/components/schemas/AccessReason' }
          example: { error: { code: payment_required, message: "Your account is INACTIVE your school hasn't subscribed yet", reason: not_subscribed } }
    NotFound:
      description: '`not_found`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: invalid }
            message: { type: string, description: Safe to show to the user }
            field: { type: string, description: The request field that caused it, when there is one }
            reason: { type: string, description: 'On 402 payment_required: why there is no access' }
            details: { type: object, description: 'Extra data, e.g. the bad rows of a list upload' }

    InstituteRef:
      type: object
      properties:
        name: { type: string, example: 'Delhi Public School, R.K. Puram' }
        institute_code: { type: string, example: DPS-RKP }
        type: { type: string, enum: [school, tuition, coaching, other] }

    ListEntry:
      type: object
      description: How a student is found on an institute's list
      required: [full_name, phone_no, institute_code]
      properties:
        full_name: { type: string, maxLength: 80, description: As the institute gave it; case and extra spaces are ignored, example: Ananya Sharma }
        phone_no: { type: string, description: 10-digit mobile; +91 / 0 / spaces / dashes allowed, example: '9876543210' }
        institute_code: { type: string, description: Case-insensitive, example: DPS-RKP }

    Student:
      type: object
      description: A student account (user_metadata)
      properties:
        id: { type: integer }
        username: { type: string, example: ananya.s }
        full_name: { type: string, example: Ananya Sharma }
        leaderboard_name: { type: string, example: Ananya S., description: First name + last initial (schema §2.1) }
        phone_no: { type: string, example: '9876543210', description: Only ever returned to the student themself or to admins }
        email: { type: [string, 'null'], format: email, description: Only ever returned to the student themself or to admins }
        email_verified: { type: boolean, description: 'Confirmed: they opened a "Confirm email" (or reset) link sent to it. Forgot-password only works when true.' }
        institute:
          description: Their school when they're on a school's list, else the first institute they registered through
          oneOf: [{ $ref: '#/components/schemas/InstituteRef' }, { type: 'null' }]
        class: { type: integer, enum: [9, 10] }
        board: { type: string, enum: [CBSE, ICSE, State Board] }
        city: { type: string }
        current_career: { type: [string, 'null'], example: UX Designer }
        created_at: { type: string, format: date-time }

    AdminStudent:
      allOf:
        - $ref: '#/components/schemas/Student'
        - type: object
          properties:
            is_deleted: { type: boolean }
            deleted_at: { type: [string, 'null'], format: date-time }
            last_login_at: { type: [string, 'null'], format: date-time }
            access: { $ref: '#/components/schemas/Access' }
            deactivation:
              description: Set while deactivated for malpractice
              oneOf:
                - type: object
                  properties:
                    reason: { type: string, enum: [malpractice] }
                    note: { type: string }
                    deactivated_at: { type: string, format: date-time }
                    by: { type: [object, 'null'], properties: { id: { type: string, format: uuid }, full_name: { type: string } } }
                - type: 'null'

    StudentEvent:
      type: object
      description: One entry in a student's history
      properties:
        kind: { type: string, enum: [deactivated, reactivated, left_institute, details_changed, password_set, moved_school] }
        note: { type: [string, 'null'] }
        data: { type: object, description: 'Old/new details, institutes involved; moved_school has from, to and via (upload, link, register, join_request, details_changed, cleanup)' }
        created_at: { type: string, format: date-time }
        admin: { type: [object, 'null'], description: null for automatic events, properties: { id: { type: string, format: uuid }, full_name: { type: string } } }

    QuizResult:
      type: object
      description: One saved career quiz run. The raw answers are not returned.
      properties:
        id: { type: integer }
        riasec_pct:
          type: object
          additionalProperties: { type: integer, minimum: 0, maximum: 100 }
          example: { R: 22, I: 35, A: 15, S: 5, E: 35, C: 23 }
        riasec_code: { type: string, example: IEC }
        confidence: { type: [string, 'null'], enum: [high, medium, low, null] }
        top_career: { type: string, example: Quantitative Analyst (Quant) }
        results: { type: object, description: The full `appResults` object, as saved }
        engine_version: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    Career:
      type: object
      properties:
        title: { type: string, example: Computer Science Engineer (Software & Systems) }
        emoji: { type: string, example: 💻 }
        field: { type: string, example: Technology }
        family: { type: string, example: computing, description: Careers competing for the same shortlist slot share one }
        stream: { type: string, example: PCM+CS }
        salary: { type: string, example: ₹5–9 LPA starting }
        riasec:
          type: object
          additionalProperties: { type: integer, minimum: 0, maximum: 100 }
          example: { R: 35, I: 90, A: 40, S: 30, E: 35, C: 75 }
        domains: { type: array, items: { type: string }, example: [digital] }
        subjects: { type: array, items: { type: string }, example: [maths, computers, physics] }
        why: { type: string, example: Breaking a problem into logical steps and building something that works. }

    Roadmap:
      type: object
      description: One career's timeline, Class 10 to first job.
      properties:
        career: { type: string, example: UI/UX Designer }
        emoji: { type: [string, 'null'], example: 🎨 }
        steps:
          type: array
          items: { $ref: '#/components/schemas/RoadmapStep' }
        updated_at: { type: string, format: date-time }

    RoadmapStep:
      type: object
      required: [period, title, actions]
      properties:
        period: { type: string, maxLength: 60, example: Class 11–12 }
        title: { type: string, maxLength: 150, example: Choose PCM + Computer Science · Build skills }
        actions:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, maxLength: 200 }
          example: [Focus on Physics, Maths, CS — target 85%+]

    CareerNews:
      type: object
      description: One career's My Career Space feed, one list per tab.
      properties:
        career:
          type: object
          properties:
            title: { type: string, example: Robotics & Mechatronics Engineer }
            emoji: { type: string, example: 🤖 }
        categories:
          type: array
          description: Always these four, in this order.
          items:
            type: object
            properties:
              key: { type: string, enum: [news, jobs, exams, scholarships] }
              label: { type: string, example: Jobs & Internships }
              items:
                type: array
                maxItems: 30
                items: { $ref: '#/components/schemas/NewsItem' }
        sources:
          type: array
          description: The providers that answered the last fetch.
          items: { type: string }
          example: [GNews, Google News]
        updated_at: { type: string, format: date-time, description: When the feed was fetched. }

    NewsItem:
      type: object
      properties:
        title: { type: string, example: IIT Delhi opens applications for robotics programme }
        url: { type: string, format: uri, description: Always http(s). Opens the publisher's page (Google News links redirect there). }
        source: { type: [string, 'null'], example: The Times of India }
        published_at: { type: [string, 'null'], format: date-time }
        image: { type: [string, 'null'], format: uri, description: A thumbnail, when the provider has one. }
        provider: { type: string, example: Google News }

    AdminRoadmapRow:
      type: object
      description: One career in the admin's roadmap list. Roadmap fields are null when it has none.
      properties:
        career: { type: string, example: UI/UX Designer }
        emoji: { type: string, example: 🎨 }
        field: { type: string, example: Design + Technology }
        stream: { type: string, example: PCM+CS }
        family: { type: string, example: computing }
        has_roadmap: { type: boolean }
        step_count: { type: [integer, 'null'], example: 5 }
        version: { type: [integer, 'null'], example: 1 }
        updated_at: { type: [string, 'null'], format: date-time }
        updated_by: { type: [string, 'null'], description: The admin's name; null for seeded roadmaps }

    AdminRoadmap:
      type: object
      properties:
        career:
          type: object
          properties:
            title: { type: string }
            emoji: { type: string }
            field: { type: string }
            stream: { type: string }
            salary: { type: string, example: ₹5–13 LPA starting }
        roadmap:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                steps: { type: array, items: { $ref: '#/components/schemas/RoadmapStep' } }
                version: { type: integer }
                updated_at: { type: string, format: date-time }
                updated_by: { type: [string, 'null'] }

    AccessReason:
      type: [string, 'null']
      enum: [not_subscribed, pending_approval, no_institute, null]
      description: |
        `not_subscribed`: no institute list they're on has a subscription covering today.
        `pending_approval`: same, and they've asked to join an institute (join request) that an admin hasn't approved yet.
        `no_institute`: they're on no institute's list at all (they left, or were removed).

    Access:
      type: object
      properties:
        has_access: { type: boolean }
        source: { type: [string, 'null'], enum: [institute, null] }
        reason: { $ref: '#/components/schemas/AccessReason' }
        message:
          type: [string, 'null']
          description: What the paywall shows when there's no access
          example: Your account is INACTIVE your school hasn't subscribed yet
        institute:
          description: The institute whose subscription covers them, else the one they're waiting on (`pending_approval`), else the one their account shows
          oneOf:
            - { type: object, properties: { name: { type: string }, institute_code: { type: string } } }
            - type: 'null'
        ends_at: { type: [string, 'null'], format: date-time, description: When the covering subscription ends }

    SessionResponse:
      type: object
      properties:
        student: { $ref: '#/components/schemas/Student' }
        access: { $ref: '#/components/schemas/Access' }

    Profile:
      type: object
      description: |
        class, board and city come from the account (asked at registration; they
        can be changed but not cleared). The rest are the onboarding answers.
      properties:
        class: { type: integer, enum: [9, 10] }
        board: { type: string, enum: [CBSE, ICSE, State Board] }
        medium: { type: [string, 'null'], enum: [English, Hindi, Regional Language, null] }
        city: { type: string }
        marks:
          type: [object, 'null']
          additionalProperties: { type: number, minimum: 0, maximum: 100 }
          example: { Mathematics: 87, Science: 79, English: 82, Social Studies: 74 }
        favourite_subjects: { type: [array, 'null'], items: { type: string } }
        hobbies: { type: [array, 'null'], items: { type: string } }
        dream_job: { type: [string, 'null'] }
        career_preference: { type: [string, 'null'], enum: [Private Sector, Government Job, Entrepreneur, null] }
        study_location: { type: [string, 'null'], enum: ['Yes, anywhere', 'Same state only', 'Prefer home city', null] }
        completed_at: { type: [string, 'null'], format: date-time, readOnly: true }

    Payment:
      type: object
      properties:
        id: { type: integer }
        transaction_id: { type: [string, 'null'] }
        institute_id: { type: [integer, 'null'], description: '`NULL` after the institute is hard-deleted' }
        mode_of_payment: { type: string }
        amount: { type: number, description: Rupees }
        date_of_payment: { type: string, format: date }
        created_at: { type: string, format: date-time }
        subscription_id: { type: [integer, 'null'], description: The subscription it pays for (in payment lists) }

    Subscription:
      type: object
      properties:
        id: { type: integer }
        institute_id: { type: integer }
        head_count: { type: integer }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time, description: Exclusive }
        payment: { oneOf: [{ $ref: '#/components/schemas/Payment' }, { type: 'null' }], description: '`null` until the payment is recorded' }
        created_at: { type: string, format: date-time }
        current: { type: boolean, description: Covers now (in lists) }
        students: { type: integer, description: List rows on this subscription }

    Contest:
      description: As seen by students (contest spec §4)
      type: object
      properties:
        id: { type: integer, example: 5 }
        number: { type: integer, example: 5 }
        opens_at: { type: string, format: date-time, example: '2026-10-03T01:30:00.000Z' }
        closes_at: { type: string, format: date-time, example: '2026-10-04T13:30:00.000Z' }
        status: { type: string, enum: [upcoming, open, closed] }
        question_count: { type: integer, const: 5 }
        points_per_question: { type: integer, const: 10 }

    PublicQuestion:
      description: A question without its answer
      type: object
      properties:
        id: { type: string, example: c5-q1 }
        area: { type: string, enum: [Logical Reasoning, Numerical Ability, Verbal Ability, Spatial Reasoning] }
        text: { type: string }
        options: { type: array, items: { type: string }, minItems: 4, maxItems: 4 }

    Rank:
      type: object
      properties:
        rank: { type: integer, example: 50 }
        total: { type: integer, example: 500 }

    LeaderboardRow:
      type: object
      properties:
        rank: { type: integer }
        name: { type: string, example: Ananya S. }
        career: { type: [string, 'null'], example: Architect }
        career_emoji: { type: string, example: 🏛️ }
        score: { type: integer }
        correct: { type: integer }
        total_questions: { type: integer, description: 'Week: 5. Live: 5 × contests.' }
        time_taken_s: { type: integer }
        contests: { type: integer, description: Live only }
        is_me: { type: boolean }

    AdminRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }

    Admin:
      allOf:
        - $ref: '#/components/schemas/AdminRef'
        - type: object
          properties:
            last_login_at: { type: [string, 'null'], format: date-time }
            is_deleted: { type: boolean }
            deleted_at: { type: [string, 'null'], format: date-time }
            created_at: { type: string, format: date-time }
            is_me: { type: boolean }

    AdminContest:
      type: object
      properties:
        id: { type: integer }
        opens_at: { type: string, format: date-time }
        closes_at: { type: string, format: date-time }
        status: { type: string, enum: [draft, scheduled] }
        state: { type: string, enum: [upcoming, open, closed], description: Worked out from now() }
        locked: { type: boolean, description: True once it has opened; questions can't change }
        scored_at: { type: [string, 'null'], format: date-time }
        question_count: { type: integer, minimum: 0, maximum: 5 }
        created_by: { type: [string, 'null'], description: Admin's name }
        is_deleted: { type: boolean }
        deleted_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    AdminContestDetail:
      allOf:
        - $ref: '#/components/schemas/AdminContest'
        - type: object
          properties:
            questions:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/PublicQuestion'
                  - type: object
                    properties:
                      position: { type: integer, minimum: 1, maximum: 5 }
                      correct_index: { type: integer, minimum: 0, maximum: 3 }
                      explanation: { type: string }

    QuestionInput:
      type: object
      required: [area, text, options, correct_index, explanation]
      properties:
        area: { type: string, enum: [Logical Reasoning, Numerical Ability, Verbal Ability, Spatial Reasoning] }
        text: { type: string }
        options: { type: array, items: { type: string }, minItems: 4, maxItems: 4, uniqueItems: true }
        correct_index: { type: integer, minimum: 0, maximum: 3 }
        explanation: { type: string, description: Shown to students after the contest closes }

    InstituteInput:
      type: object
      required: [name, institute_code, type, city]
      properties:
        name: { type: string, maxLength: 120 }
        institute_code: { type: string, pattern: '^[A-Za-z0-9-]{3,20}$', description: 'The institute ID students type. Stored upper-case.', example: DPS-RKP }
        type: { type: string, enum: [school, tuition, coaching, other], description: '`school` wins when a student is on several lists' }
        address: { type: [string, 'null'] }
        city: { type: string, maxLength: 80 }
        contact_details: { type: [string, 'null'], maxLength: 255 }
        status: { type: string, enum: [active, suspended], default: active }
        accepts_requests: { type: boolean, default: false, description: 'Students not on its list may register and ask to join; an admin approves each. Left out on update: unchanged' }
        pilot_mode:
          type: boolean
          default: false
          description: |
            Free pilot before the institute pays. While it's live (on, before
            `pilot_ends_at`, institute active), students not on its list
            register with the institute ID and get access straight away, up to
            the seat limit for their class. Set false to stop it at once. One
            pilot per institute: turning it on again continues the same pilot.
            Left out on update: unchanged.
        pilot_ends_at: { type: string, format: date-time, description: 'When pilot access and sign-ups end. Required while `pilot_mode` is on; must be in the future when turning the pilot on or changing this. Left out on update: unchanged' }
        pilot_seats_class9: { type: integer, minimum: 0, maximum: 1000, default: 5, description: 'Pilot seats for class 9. Left out on update: unchanged' }
        pilot_seats_class10: { type: integer, minimum: 0, maximum: 1000, default: 5, description: 'Pilot seats for class 10. Left out on update: unchanged' }

    JoinRequest:
      type: object
      properties:
        id: { type: integer }
        requested_at: { type: string, format: date-time }
        full_name: { type: string }
        phone_no: { type: string }
        student:
          type: object
          properties:
            id: { type: integer }
            username: { type: string }
            email: { type: [string, 'null'] }
            class: { type: integer }
            board: { type: string }
            city: { type: string }
            is_deleted: { type: boolean }

    Institute:
      allOf:
        - $ref: '#/components/schemas/InstituteInput'
        - type: object
          properties:
            id: { type: integer }
            is_deleted: { type: boolean }
            deleted_at: { type: [string, 'null'], format: date-time }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            list_count: { type: integer, description: Students on its list }
            registered_count: { type: integer, description: Of those, how many have registered }
            pending_count: { type: integer, description: Join requests waiting for approval }
            pilot:
              type: object
              properties:
                mode: { type: boolean, description: The admin's toggle }
                live: { type: boolean, description: 'On, before its end time, and the institute is active and not deleted' }
                ends_at: { type: [string, 'null'], format: date-time }
                seats:
                  type: object
                  description: '`used`: pilot students who have never been on a subscription'
                  properties:
                    class9: { type: object, properties: { limit: { type: integer }, used: { type: integer } } }
                    class10: { type: object, properties: { limit: { type: integer }, used: { type: integer } } }
            subscription:
              description: The current subscription, else the latest one, else null
              oneOf:
                - type: object
                  properties:
                    id: { type: integer }
                    active: { type: boolean }
                    head_count: { type: integer }
                    paid: { type: boolean, description: Its payment is recorded }
                    starts_at: { type: string, format: date-time }
                    ends_at: { type: string, format: date-time }
                - type: 'null'

    ListRow:
      type: object
      description: One student on an institute's list ("user" table)
      properties:
        full_name: { type: string }
        phone_no: { type: string }
        status: { type: string, enum: [unregistered, registered] }
        registered_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        via_pilot: { type: boolean, description: Added by a pilot sign-up rather than an upload }
        student: { oneOf: [{ type: object, properties: { id: { type: integer }, username: { type: string } } }, { type: 'null' }] }
        subscription:
          oneOf:
            - { type: object, properties: { id: { type: integer }, active: { type: boolean }, ends_at: { type: string, format: date-time } } }
            - type: 'null'
